<svg xmlns="http://www.w3.org/2000/svg" width="760" height="140" viewBox="0 0 760 140">

    <style>
      .bg { fill: #0d1117; }
      .title { fill: #58a6ff; font: 600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
      .text { fill: #c9d1d9; font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
      .muted { fill: #8b949e; font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
      .line { stroke: #21262d; stroke-width: 1; }
      .dot { fill: #58a6ff; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .title { fill: #0969da; }
        .text { fill: #24292f; }
        .muted { fill: #57606a; }
        .line { stroke: #d8dee4; }
        .dot { fill: #0969da; }
      }
    </style>
    
<rect class="bg" x="0" y="0" width="760" height="140" rx="14"/>
<text class="title" x="24" y="34">Recent public activity</text>
<line class="line" x1="24" y1="48" x2="736" y2="48"/>
<circle class="dot" cx="31" cy="74" r="4"/>
<text class="text" x="48" y="78">No recent public activity yet.</text>
</svg>